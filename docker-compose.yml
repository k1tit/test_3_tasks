services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      N_PRICES: ${N_PRICES:-300000}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/assignment:ro
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 20s
    restart: unless-stopped

  etl:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ETL_START_DATE: ${ETL_START_DATE:-}
      ETL_END_DATE: ${ETL_END_DATE:-}
      AS_OF_DATE: ${AS_OF_DATE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./etl:/app/etl
      - ./ml:/app/ml
      - ./sql:/app/sql
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
